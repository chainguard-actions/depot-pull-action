name: Test missing required build-id input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          build-id: ''
          token: fake-depot-token

      - name: Assert action fails when build-id is empty
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected with empty build-id"
          elif [ "$OUTCOME" = "success" ]; then
            echo "WARN: action succeeded with empty build-id (may be handled downstream)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
