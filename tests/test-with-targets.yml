name: Test pull with bake targets
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          build-id: fake-build-id-12345
          targets: |
            app
            worker
      - name: Assert action ran with targets (fails gracefully without a real Depot build)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with targets"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no real Depot build available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
